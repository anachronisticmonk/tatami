# The back end plus the database it is checked against.
#
#   docker compose up            server on :8000, postgres on :5432
#   docker compose run --rm shred   shred the corpus into the four tables
#
# `docker run -p 8000:8000 tatami/backend` is enough for the three tabs; this
# file is for the half of the work the tabs do not show -- that the JSON and
# the relational store hold the same data.

services:
  backend:
    build: .
    image: tatami/backend
    ports: [ "8000:8000" ]
    environment:
      # a larger corpus than the 1,000 repos baked into the image
      TATAMI_ROWS: "${TATAMI_ROWS:-}"
      TATAMI_BYTES: "${TATAMI_BYTES:-}"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tatami
      POSTGRES_PASSWORD: tatami
      POSTGRES_DB: tatami
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tatami -d tatami" ]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
