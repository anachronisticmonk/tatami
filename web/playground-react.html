<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatami Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
  /* Dark by default, in the palette a code editor uses -- VS Code's Dark+:
     #1E1E1E behind the page, #252526 behind a panel, #D4D4D4 for text, and the
     blue/teal/green the same editor gives keywords, types and comments. Light
     is the other one, and there is no third. */
  :root {
    --bg: #1E1E1E; --surface: #252526; --sunk: #181818; --rail: #2D2D2D;
    --ink: #D4D4D4; --muted: #9D9D9D; --faint: #858585; --line: #3C3C3C;
    --accent: #4FC1FF; --accent-bg: #10344F;
    --gold: #DCDCAA; --gold-bg: #33301E;
    --alarm: #F48771; --alarm-bg: #3A1D1D;
    --heri: #4EC9B0; --sel: #264F78;
    /* syntax, kept apart from the interface tokens: a comment is green in an
       editor and muted grey in a sentence, and one variable cannot be both */
    --kw: #569CD6; --ty: #4EC9B0; --cm: #6A9955;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --code-size: 13.5px; --code-line: 1.62; --code-pad: 14px;
  }

  /* Named so the toggle can set it back explicitly; identical to the default. */
  :root[data-theme="dark"] {
    --bg: #1E1E1E; --surface: #252526; --sunk: #181818; --rail: #2D2D2D;
    --ink: #D4D4D4; --muted: #9D9D9D; --faint: #858585; --line: #3C3C3C;
    --accent: #4FC1FF; --accent-bg: #10344F;
    --gold: #DCDCAA; --gold-bg: #33301E;
    --alarm: #F48771; --alarm-bg: #3A1D1D;
    --heri: #4EC9B0; --sel: #264F78;
    --kw: #569CD6; --ty: #4EC9B0; --cm: #6A9955;
  }

  /* Light. The accent is a deep saffron rather than #FF9933: flag saffron on a
     pale ground measures about 2:1 against the text around it, which fails at
     body size, while this reads as the same hue at 4.7:1. The bright tone is
     kept for fills, where contrast is not being asked of it. */
  :root[data-theme="light"] {
    --bg: #FFF6EA; --surface: #FFFDFA; --sunk: #FBE9D4; --rail: #FDF1E3;
    --ink: #241A10; --muted: #6B5742; --faint: #8A7458; --line: #EBD9C2;
    --accent: #B35C00; --accent-bg: #FFE4C4;
    --gold: #8A6C1F; --gold-bg: #F5E9CE;
    --alarm: #9E3A22; --alarm-bg: #F5DFD8;
    --heri: #2B3A4A; --sel: #FFD9A8;
    --kw: #9A4B00; --ty: #21606E; --cm: #4F7A3A;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 26px 22px 56px; }

  /* header */
  header { border-bottom: 2px solid var(--heri); padding-bottom: 16px; margin-bottom: 18px; }
  h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(26px, 3.2vw, 34px); letter-spacing: -0.015em;
    margin: 0 0 5px; text-wrap: balance;
  }
  .lede { color: var(--muted); margin: 0; max-width: 74ch; font-size: 14.5px; }
  .stage {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent);
    background: var(--accent-bg); border: 1px solid var(--line);
    padding: 2px 7px; margin-bottom: 9px;
  }
  .crumbs {
    position: absolute; top: 0; right: 0; display: flex; gap: 6px; align-items: center;
  }
  .crumbs a {
    font-family: var(--sans); font-size: 12.5px; background: var(--surface);
    color: var(--ink); border: 1px solid var(--line); padding: 4px 10px;
    text-decoration: none;
  }
  .crumbs a:hover { border-color: var(--accent); color: var(--accent); }
  header { position: relative; }

  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; align-items: baseline; }
  .examples .label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--faint); margin-right: 3px;
  }
  button.chip {
    font-family: var(--sans); font-size: 12.5px; background: var(--surface);
    color: var(--ink); border: 1px solid var(--line); padding: 4px 10px; cursor: pointer;
  }
  button.chip:hover { border-color: var(--accent); color: var(--accent); }
  button.chip.on {
    border-color: var(--accent); color: var(--accent); background: var(--accent-bg);
    font-weight: 500;
  }
  button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* workbench */
  .bench {
    display: grid; grid-template-columns: minmax(300px, 4fr) 7fr;
    gap: 2px; background: var(--line); border: 1px solid var(--line);
  }
  @media (max-width: 1040px) { .bench { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); display: flex; flex-direction: column; min-width: 0; }

  .bar {
    display: flex; align-items: stretch; gap: 0; background: var(--sunk);
    border-bottom: 1px solid var(--line); min-height: 40px;
  }
  .bar .title {
    display: flex; align-items: center; padding: 0 12px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 0 10px; }

  button.tab {
    font-family: var(--sans); font-size: 13px; background: none; color: var(--muted);
    border: 0; border-bottom: 2px solid transparent; padding: 0 13px; cursor: pointer;
  }
  button.tab:hover { color: var(--ink); }
  button.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  button.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  button.tab .count {
    font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: 5px;
  }
  button.tab[aria-selected="true"] .count { color: var(--accent); }
  button.tab.warn { color: var(--alarm); }

  .engine {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); padding: 2px 6px; white-space: nowrap;
  }
  .engine.live { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }

  button.act {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 3px 8px; cursor: pointer; white-space: nowrap;
  }
  button.act:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  button.act:disabled { opacity: 0.4; cursor: default; }
  button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  textarea.plain {
    font-family: var(--mono); font-size: var(--code-size); line-height: var(--code-line);
    margin: 0; padding: var(--code-pad); border: 0; width: 100%; flex: 1;
    background: var(--surface); color: var(--ink); outline: none; tab-size: 2; resize: none;
  }
  textarea.plain:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  #in { min-height: 520px; resize: vertical; }

  .pane { display: none; flex-direction: column; flex: 1; min-height: 520px; min-width: 0; }
  .pane.on { display: flex; }

  /* modules */
  .editor { display: grid; grid-template-columns: 186px 1fr; flex: 1; min-height: 0; }
  @media (max-width: 640px) { .editor { grid-template-columns: 1fr; } }
  aside.files {
    background: var(--rail); border-right: 1px solid var(--line);
    padding: 9px 0; overflow-y: auto; min-width: 0;
  }
  .files h4 {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faint); font-weight: 500;
    margin: 0 0 4px; padding: 0 12px;
  }
  .files h4:not(:first-child) { margin-top: 14px; }
  .files button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-left: 2px solid transparent; cursor: pointer; font-family: var(--mono);
    font-size: 12.5px; color: var(--muted); padding: 4px 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .files button:hover { color: var(--ink); background: var(--sunk); }
  .files button.on { color: var(--accent); border-left-color: var(--accent); background: var(--accent-bg); }
  .files .dot { color: var(--gold); }
  .files .indent { padding-left: 24px; }

  .code { display: flex; flex-direction: column; min-width: 0; }
  .notice {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 12px; background: var(--gold-bg); border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--gold);
  }
  .notice.on { display: flex; }
  .surface { position: relative; flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .gutter {
    font-family: var(--mono); font-size: var(--code-size); line-height: var(--code-line);
    padding: var(--code-pad) 8px var(--code-pad) 12px; margin: 0;
    color: var(--faint); background: var(--sunk); border-right: 1px solid var(--line);
    text-align: right; user-select: none; overflow: hidden; white-space: pre;
    font-variant-numeric: tabular-nums; min-width: 3.2em;
  }
  .stack { position: relative; flex: 1; min-width: 0; }
  .stack pre, .stack textarea {
    font-family: var(--mono); font-size: var(--code-size); line-height: var(--code-line);
    padding: var(--code-pad); margin: 0; border: 0; position: absolute; inset: 0;
    width: 100%; height: 100%; white-space: pre; overflow: auto; tab-size: 2;
  }
  .stack pre { color: var(--ink); background: var(--surface); pointer-events: none; }
  .stack textarea {
    color: transparent; background: transparent; caret-color: var(--accent);
    resize: none; outline: none;
  }
  .stack textarea::selection { background: var(--sel); }
  .kw { color: var(--kw); }
  .cm { color: var(--cm); font-style: italic; }
  .ty { color: var(--ty); }

  .error {
    font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--alarm);
    background: var(--alarm-bg); padding: 16px; border-left: 3px solid var(--alarm);
    margin: 0; white-space: pre-wrap;
  }
  .error-aside {
    font-family: var(--sans); font-size: 13px; color: var(--muted);
    padding: 12px 16px; border-top: 1px solid var(--line);
  }
  .error-aside code { font-family: var(--mono); font-size: 0.92em; color: var(--ink); }

  /* shape */
  .scroll { overflow-y: auto; flex: 1; padding: 4px 0; }
  .lead {
    font-size: 13.5px; color: var(--muted); margin: 0;
    padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--sunk);
  }
  .lead strong { color: var(--ink); font-weight: 600; }

  .field { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .field-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .field code.path {
    font-family: var(--mono); font-size: 13.5px; font-weight: 500; color: var(--ink);
  }
  .field .kind {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--faint);
  }
  .field select {
    margin-left: auto; font-family: var(--sans); font-size: 13px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); padding: 4px 8px; max-width: 100%;
  }
  .field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field input[type="text"] {
    margin-left: auto; font-family: var(--mono); font-size: 13px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); padding: 4px 8px; max-width: 14ch;
  }
  .field input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field select.set { border-color: var(--accent); color: var(--accent); }
  .field .fixed {
    margin-left: auto; font-family: var(--sans); font-size: 13px; color: var(--faint);
  }
  .field .says { font-size: 13px; color: var(--muted); margin: 7px 0 0; max-width: 80ch; }
  .field .says b { color: var(--ink); font-weight: 500; }
  .field .yields {
    font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 5px;
  }

  /* config */
  .cfg-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--sunk); flex-wrap: wrap;
  }
  .cfg-head p { margin: 0; font-size: 13px; color: var(--muted); flex: 1; min-width: 20ch; }
  .cfg-bad {
    display: none; font-family: var(--mono); font-size: 12.5px; color: var(--alarm);
    background: var(--alarm-bg); padding: 9px 16px; border-bottom: 1px solid var(--line);
  }
  .cfg-bad.on { display: block; }

  /* observations */
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th {
    text-align: left; font-family: var(--mono); font-weight: 500; font-size: 10.5px;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint);
    padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.mono { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  td.counts {
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--muted); white-space: nowrap;
  }
  .tag {
    display: inline-block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.05em; padding: 1px 5px; margin: 0 3px 3px 0;
    border: 1px solid var(--line); color: var(--gold); background: var(--gold-bg);
  }
  .tbl { padding: 14px 16px 4px; }
  .tbl h3 {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink);
    margin: 0 0 7px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px;
  }
  .tbl h3 span {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--faint); font-weight: 400;
  }
  .note { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 18px 16px; }
  .table-scroll { overflow-x: auto; }

  footer {
    margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12.5px; max-width: 90ch;
  }
  footer code { font-family: var(--mono); font-size: 0.92em; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<!-- The engine, lifted verbatim from web/playground.html: the same reader,
     the same mangling, the same inference and the same emitter. Only the page
     around it is new, so what this renders is what that page renders. Re-lift
     it whenever that file changes, or the two will answer differently. -->
<script>
var Engine = (function () {

  "use strict";

  /* ------------------------------------------------------------------
     A small JSON reader.

     Deliberately not JSON.parse: we need the raw text of each number to
     tell `1` from `1.0` (the lexical split), and we need duplicate keys
     to survive so they can be rejected rather than silently overwritten.
     ------------------------------------------------------------------ */

  function readJson(src) {
    var i = 0;

    function fail(msg) { throw { tag: "parse", msg: msg + " at position " + i }; }
    function ws() { while (i < src.length && /\s/.test(src[i])) i++; }

    function str() {
      if (src[i] !== '"') fail("expected a string");
      i++;
      var out = "";
      while (i < src.length && src[i] !== '"') {
        if (src[i] === "\\") {
          i++;
          var c = src[i++];
          if (c === "n") out += "\n";
          else if (c === "t") out += "\t";
          else if (c === "r") out += "\r";
          else if (c === "b") out += "\b";
          else if (c === "f") out += "\f";
          else if (c === "u") { out += String.fromCharCode(parseInt(src.substr(i, 4), 16)); i += 4; }
          else out += c;
        } else out += src[i++];
      }
      if (src[i] !== '"') fail("unterminated string");
      i++;
      return out;
    }

    function num() {
      var start = i;
      if (src[i] === "-") i++;
      while (i < src.length && /[0-9]/.test(src[i])) i++;
      if (src[i] === ".") { i++; while (i < src.length && /[0-9]/.test(src[i])) i++; }
      if (src[i] === "e" || src[i] === "E") {
        i++;
        if (src[i] === "+" || src[i] === "-") i++;
        while (i < src.length && /[0-9]/.test(src[i])) i++;
      }
      var raw = src.slice(start, i);
      if (!/^-?[0-9]/.test(raw)) fail("malformed number");
      return { k: "num", raw: raw };
    }

    function arr() {
      i++; ws();
      var items = [];
      if (src[i] === "]") { i++; return { k: "arr", items: items }; }
      for (;;) {
        items.push(value()); ws();
        if (src[i] === ",") { i++; ws(); continue; }
        if (src[i] === "]") { i++; return { k: "arr", items: items }; }
        fail("expected , or ]");
      }
    }

    function obj() {
      i++; ws();
      var members = [];
      if (src[i] === "}") { i++; return { k: "obj", members: members }; }
      for (;;) {
        ws();
        var key = str(); ws();
        if (src[i] !== ":") fail("expected :");
        i++;
        members.push([key, value()]); ws();
        if (src[i] === ",") { i++; continue; }
        if (src[i] === "}") { i++; return { k: "obj", members: members }; }
        fail("expected , or }");
      }
    }

    function value() {
      ws();
      var c = src[i];
      if (c === "{") return obj();
      if (c === "[") return arr();
      if (c === '"') { return { k: "str", s: str() }; }   /* kept: uuid is a shape */
      if (c === "-" || (c >= "0" && c <= "9")) return num();
      if (src.startsWith("true", i)) { i += 4; return { k: "bool" }; }
      if (src.startsWith("false", i)) { i += 5; return { k: "bool" }; }
      if (src.startsWith("null", i)) { i += 4; return { k: "null" }; }
      fail(c === undefined ? "unexpected end of input" : "unexpected character " + JSON.stringify(c));
    }

    var v = value();
    ws();
    if (i < src.length) fail("trailing content");
    return v;
  }

  /* ------------------------------------------------------------------
     Names: every byte outside [A-Za-z0-9'] escapes to _hh, including _
     itself, so _ is an unambiguous escape introducer and two distinct
     member names can never collide.
     ------------------------------------------------------------------ */

  var KEYWORDS = ("and as assert asr begin class constraint do done downto else end exception " +
    "external false for fun function functor if in include inherit initializer land lazy let " +
    "lor lsl lsr lxor match method mod module mutable new nonrec object of open or private rec " +
    "sig struct then to true try type val virtual when while with").split(" ");

  var encoder = new TextEncoder();

  function mangle(name) {
    var bytes = encoder.encode(name);
    var core = "";
    for (var n = 0; n < bytes.length; n++) {
      var b = bytes[n];
      var ok = (b >= 97 && b <= 122) || (b >= 65 && b <= 90) || (b >= 48 && b <= 57) || b === 39;
      core += ok ? String.fromCharCode(b) : "_" + b.toString(16).padStart(2, "0");
    }
    /* Tatami/Mangle.lean:69 -- 'f' :: '_' :: '_' :: core. This shipped with a
       single underscore, which disagreed with the binary on every name that
       does not start lower-case. */
    var out = /^[a-z]/.test(core) ? core : "f__" + core;
    return KEYWORDS.indexOf(out) >= 0 ? out + "_" : out;
  }

  /* ------------------------------------------------------------------
     Paths and module names.

     A path is a list of steps from the root: {m:"name"} into a member,
     {e:1} into the elements of an array, {y:1} into the entries of an object
     marked as a map. It identifies a table, and the member names along it are
     what the module is called.
     ------------------------------------------------------------------ */

  function seg(k) { return { m: k }; }
  var ELEM = { e: 1 }, ENTRY = { y: 1 };

  function segString(s) { return s.m !== undefined ? "." + s.m : s.e ? "[]" : "{}"; }
  function pathString(p) { return p.length ? p.map(segString).join("") : "."; }
  function pathNames(p) {
    return p.filter(function (s) { return s.m !== undefined; }).map(function (s) { return s.m; });
  }
  function inCollection(p) {
    return p.length > 0 && (p[p.length - 1].e === 1 || p[p.length - 1].y === 1);
  }
  function isEntry(p) { return p.length > 0 && p[p.length - 1].y === 1; }
  /* The table holding the collection these rows sit in: drop the collection
     marker and the member it belongs to. Mirrors Path.parentOfElement. */
  function parentOfElement(p) {
    var n = p.length;
    if (n >= 2 && (p[n - 1].e === 1 || p[n - 1].y === 1) && p[n - 2].m !== undefined)
      return p.slice(0, n - 2);
    return null;
  }

  function parsePath(str) {
    if (str === ".") return [];
    var out = [], i = 0;
    while (i < str.length) {

      ok: true,
      ocaml: units.map(u => u.text).join('\n'),
      files: units.map(u => ({name: u.name, ocaml: u.text})),
      documents: docs.length,
      tables: tables.map(t => ({
        path: Engine.pathString(t.path),
        module: Engine.moduleName(t.path),
        visits: t.visits,
        columns: t.members.map(m => ({
          key: m.key, name: Engine.mangle(m.key),
          type: Engine.ocamlType(m, Engine.moduleName(t.path)),
          values: m.values, nulls: m.nulls, absent: m.absent,
          widened: m.sawInt && m.sawFloat, big: m.big,
          renamed: Engine.mangle(m.key) !== m.key, neverTyped: m.ty === 'bot',
        })),
      })),
    };
  } catch (e) {
    return {ok: false, error: e.msg || String(e)};
  }
}

async function translate(src, config) {
  if (serverUp === false) return {via: 'browser', report: localReport(src, config)};
  try {
    const r = await fetch('/translate', {
      method: 'POST',
      body: JSON.stringify({input: src, config}),
    });
    if (!r.ok) throw 0;
    const j = await r.json();
    serverUp = true;
    return {via: 'lean', report: j};
  } catch (e) {
    serverUp = false;
    return {via: 'browser', report: localReport(src, config)};
  }
}

/* ---- the Observations tab, verbatim rules ---- */
const isOptional = c => / option$/.test(c.type);

function notes(c, visits) {
  const t = [];
  if (c.widened) t.push(['widened', 'an integer and a float were both seen, so the column is a float']);
  if (c.big) t.push(['widened', "an integer too large for OCaml's int widened it to float"]);
  if (c.neverTyped) t.push(['untyped', 'no value was ever observed here']);
  if (/ list$/.test(c.type)) t.push(['collection', 'holds a collection, so its members are a table of their own']);
  else if (/\./.test(c.type)) t.push(['key', 'holds an object, so the column is a key into that table']);
  if (isOptional(c)) t.push(['partial', 'absent or null somewhere, so the column carries an option']);
  if (c.renamed) t.push(['renamed', 'not a legal OCaml identifier as written']);
  if (!isOptional(c) && visits > 1) t.push(['total', 'present with a value every time']);
  return t;
}

const isCollection = p => /\[\]$|\{\}$/.test(p);

/* ---- panes ---- */

function Modules({report, file, setFile, edits, setEdits, blank}) {
  if (blank) return h('p', {className: 'lead'}, 'Nothing pasted yet \u2014 paste some JSON, or pick Full example.');
  if (!report) return h('p', {className: 'lead'}, 'reading the JSON\u2026');
  if (!report.ok)
    return h('div', {id: 'errbox'}, h('div', {className: 'err'}, report.error));
  const files = report.files || [];
  if (!files.length) return h('p', {className: 'lead'}, 'nothing to generate yet');
  const i = Math.min(file, files.length - 1);
  const f = files[i];
  const text = edits[f.name] !== undefined ? edits[f.name] : f.ocaml;
  const lines = text.split('\n');
  return h('div', {className: 'editor'},
    h('aside', {className: 'files'},
      files.map((x, k) =>
        h('button', {
          key: x.name,
          className: 'file' + (k === i ? ' on' : '') + (edits[x.name] !== undefined ? ' edited' : ''),
          onClick: () => setFile(k),
        }, x.name))),
    h('div', {className: 'code'},
      edits[f.name] !== undefined
        ? h('div', {className: 'notice', style: {display: 'flex'}},
            h('span', {}, 'Edited by hand — the JSON pane no longer updates this file.'),
            h('button', {className: 'act', onClick: () => {
              const e = {...edits}; delete e[f.name]; setEdits(e);
            }}, 'Discard edits'))
        : null,
      h('div', {className: 'surface'},
        h('pre', {className: 'gutter'}, lines.map((_, n) => n + 1).join('\n')),
        h('div', {className: 'stack'},
          h('pre', {
            'aria-hidden': true,
            dangerouslySetInnerHTML: {__html: highlight(text) + '\n'},
          }),
          h('textarea', {
            spellCheck: false, value: text,
            'aria-label': 'Generated OCaml',
            onScroll: e => {
              const pre = e.target.previousSibling;
              if (pre) { pre.scrollTop = e.target.scrollTop; pre.scrollLeft = e.target.scrollLeft; }
            },
            onChange: e => setEdits({...edits, [f.name]: e.target.value}),
          })))));
}

function Shape({report, config, setConfig}) {
  const tables = (report && report.ok && report.tables) || [];
  const paths = useMemo(() => {
    const seen = [], out = [];
    const add = p => { if (p !== '.' && seen.indexOf(p) < 0) { seen.push(p); out.push(p); } };
    tables.forEach(t => add(t.path));
    (config.maps || []).forEach(add);
    return out.sort();
  }, [report, config]);

  const toggleMap = p => {
    const maps = config.maps || [];
    setConfig({...config, maps: maps.indexOf(p) >= 0 ? maps.filter(x => x !== p) : maps.concat([p])});
  };

  return h('div', {className: 'scroll'},
    h('div', {className: 'shape-row'},
      h('div', {},
        h('div', {className: 'path'}, '. '),
        h('div', {className: 'why'},
          'The root table has no member name to be called after, so its name is invented. ',
          h('code', {}, 'Root'), ' is only a fallback.')),
      h('input', {
        type: 'text', className: 'plain', style: {width: 180},
        placeholder: 'Root', value: config.root || '',
        onChange: e => setConfig({...config, root: e.target.value}),
      })),
    paths.length === 0
      ? h('p', {className: 'lead'}, 'No nested tables yet — paste something with an array or an object in it.')
      : paths.map(p => {
          const on = (config.maps || []).indexOf(p) >= 0;
          const mods = tables.filter(t => t.path === p || t.path.indexOf(p) === 0).map(t => t.module);
          return h('div', {className: 'shape-row', key: p},
            h('div', {},
              h('div', {className: 'path'}, p),
              h('div', {className: 'why'},
                on
                  ? 'Read as a map: each member is a row keyed by its name.'
                  : isCollection(p)
                    ? 'A collection, so its elements are a table of their own.'
                    : 'Read as a record. If its keys are data rather than field names, mark it a map.',
                mods.length ? h('span', {className: 'mods'}, ' — ' + mods.join(', ')) : null)),
            h('button', {
              className: 'act' + (on ? ' on' : ''),
              onClick: () => toggleMap(p),
            }, on ? 'map ✓' : 'mark as map'));
        }));
}

function Config({config, setConfig}) {
  const wire = {};
  if ((config.maps || []).length) wire.maps = config.maps.slice();
  if (config.root) wire.root = config.root;
  const text = JSON.stringify(wire, null, 2);
  const [draft, setDraft] = useState(null);
  const [bad, setBad] = useState('');
  const shown = draft === null ? text : draft;
  return h('div', {},
    h('div', {className: 'cfg-head'},
      h('p', {}, 'The same choices as a file. Pass it to the binary with ',
        h('code', {style: {fontFamily: 'var(--mono)'}}, '--config'),
        '; edit it here and the Shape tab follows.'),
      h('button', {className: 'act', onClick: () => navigator.clipboard && navigator.clipboard.writeText(shown)}, 'Copy')),
    bad ? h('div', {className: 'cfg-bad', style: {display: 'block'}}, bad) : null,
    h('textarea', {
      className: 'plain', spellCheck: false, value: shown,
      'aria-label': 'Configuration',
      onChange: e => {
        setDraft(e.target.value);
        try {
          const c = JSON.parse(e.target.value || '{}');
          setBad('');
          setConfig({maps: c.maps || [], root: c.root || ''});
          setDraft(null);
        } catch (err) { setBad(String(err.message || err)); }
      },
    }));
}

function Obs({report}) {
  if (!report || !report.ok) return null;
  return h('div', {className: 'scroll'},
    (report.tables || []).map(t =>
      h('div', {className: 'tbl', key: t.path},
        h('h3', {}, 'module ', t.module,
          h('span', {className: 'vis'}, t.path + ' · ' + t.visits +
            (t.visits === 1 ? ' visit' : ' visits'))),
        h('table', {},
          h('thead', {}, h('tr', {},
            ['column', 'type', 'values', 'nulls', 'absent', ''].map(x =>
              h('th', {key: x}, x)))),
          h('tbody', {}, t.columns.map(c =>
            h('tr', {key: c.key},
              h('td', {className: 'mono'}, c.name,
                c.renamed ? h('span', {className: 'was'}, ' was ' + c.key) : null),
              h('td', {className: 'mono'}, c.type),
              h('td', {className: 'num'}, c.values),
              h('td', {className: 'num'}, c.nulls),
              h('td', {className: 'num'}, c.absent),
              h('td', {}, notes(c, t.visits).map(([tag, why], k) =>
                h('span', {key: k, className: 'note ' + tag, title: why}, tag)))))))))); 
}

/* Dark unless the reader says otherwise, and remembered. localStorage throws
   in a private window, so every touch of it is guarded. */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try {
      const v = localStorage.getItem('tatami-theme');
      return v === 'light' || v === 'dark' ? v : 'dark';
    } catch (e) { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('tatami-theme', theme); } catch (e) {}
  }, [theme]);
  return [theme, setTheme];
}

const NEXT = {dark: 'light', light: 'dark'};
const THEME_LABEL = {dark: 'dark', light: 'light'};

/* ---- the page ---- */

function App() {
  const [src, setSrc] = useState(Engine.EXAMPLES.note);
  const [config, setConfig] = useState({maps: [], root: ''});
  const [report, setReport] = useState(null);
  const [via, setVia] = useState('—');
  const [tab, setTab] = useState('modules');
  const [file, setFile] = useState(0);
  const [edits, setEdits] = useState({});
  const [theme, setTheme] = useTheme();
  const [tray, setTray] = useState(false);
  const seq = useRef(0);

  useEffect(() => {
    const mine = ++seq.current;
    const wire = {};
    if (config.maps.length) wire.maps = config.maps.slice();
    if (config.root) wire.root = config.root;
    const t = setTimeout(() => {
      translate(src, wire).then(({via, report}) => {
        if (seq.current !== mine) return;
        setVia(via); setReport(report);
      });
    }, 120);
    return () => clearTimeout(t);
  }, [src, config]);

  const ok = report && report.ok;
  const nMods = ok ? (report.files || []).length : 0;
  const nMark = config.maps.length + (config.root ? 1 : 0);
  const allText = ok ? (report.files || []).map(f =>
    edits[f.name] !== undefined ? edits[f.name] : f.ocaml).join('\n') : '';

  const copy = () => navigator.clipboard && navigator.clipboard.writeText(allText);
  const download = () => {
    const blob = new Blob([allText], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'schema.mli';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const TABS = [['modules', 'Modules', nMods || ''], ['shape', 'Shape', nMark || ''],
                ['config', 'Config', nMark ? '●' : ''], ['obs', 'Observations', '']];

  return h('div', {className: 'wrap'},
    h('header', {},
      /* The backend is a separate server on its own port; same host, so the
         link is built rather than hard-coded to localhost. */
      h('div', {className: 'crumbs'},
        h('a', {href: location.protocol + '//' + location.hostname + ':8000/'},
          'Phase 2 · backend →')),
      h('div', {className: 'stage'}, 'Phase 1 · JSON to OCaml signatures'),
      h('h1', {}, 'Tatami Playground'),
      h('p', {className: 'lede'},
        'Paste a JSON object, or an array of them as a corpus. Tatami infers a relational ' +
        'schema and writes the OCaml signature for it — one module per table, with the keys ' +
        'and accessors that record how the tables relate.'),
      h('div', {className: 'examples'},
        h('button', {
          className: 'chip' + (src.trim() === '' ? ' on' : ''),
          onClick: () => { setSrc(''); setEdits({}); setFile(0); },
        }, 'Blank'),
        h('button', {
          className: 'chip' + (src === FULL_EXAMPLE ? ' on' : ''),
          onClick: () => { setSrc(FULL_EXAMPLE); setEdits({}); setFile(0); },
        }, 'Full example'),
        h('button', {
          className: 'chip' + (tray ? ' on' : ''),
          onClick: () => setTray(!tray),
        }, (tray ? '\u25be ' : '\u25b8 ') + 'Try'),
        tray
          ? [['note', 'Nested object'], ['arrayObjs', 'Array of objects'], ['corpus', 'A corpus'],
             ['map', 'Keys that are data'], ['tree', 'A comment thread'], ['names', 'Awkward names'],
             ['nulls', 'Nulls and absence'], ['conflict', 'A type conflict']].map(([k, label]) =>
              h('button', {key: k, className: 'chip', onClick: () => {
                setSrc(Engine.EXAMPLES[k]); setEdits({}); setFile(0);
              }}, label))
          : null)),

    h('div', {className: 'bench'},
      h('div', {className: 'panel'},
        h('div', {className: 'bar'},
          h('span', {className: 'title'}, 'JSON in'),
          h('span', {className: 'right'},
            h('button', {
              className: 'act', style: {marginRight: 8},
              title: 'switch between light and dark',
              onClick: () => setTheme(NEXT[theme]),
            }, THEME_LABEL[theme]),
            h('span', {
              className: 'engine' + (via === 'lean' ? ' live' : ''),
              title: via === 'lean'
                ? 'Produced by the Lean binary, through the local dev server.'
                : 'No dev server reachable, so the page used its own implementation of the same rules.',
            }, via === 'lean' ? 'Lean binary' : via === 'browser' ? 'in-browser' : '—'))),
        h('textarea', {
          className: 'plain', id: 'in', spellCheck: false, 'aria-label': 'JSON input',
          value: src, onChange: e => { setSrc(e.target.value); setEdits({}); },
        })),

      h('div', {className: 'panel'},
        h('div', {className: 'bar', role: 'tablist'},
          TABS.map(([k, label, count]) =>
            h('button', {
              key: k, className: 'tab' + (tab === k ? ' on' : ''), role: 'tab',
              'aria-selected': tab === k, onClick: () => setTab(k),
            }, label, count !== '' ? h('span', {className: 'count'}, count) : null)),
          h('span', {className: 'right'},
            h('button', {className: 'act', disabled: !Object.keys(edits).length,
                         onClick: () => setEdits({})}, 'Revert'),
            h('button', {className: 'act', onClick: copy}, 'Copy'),
            h('button', {className: 'act', onClick: download}, 'Download'))),

        h('div', {className: 'pane on'},
          tab === 'modules' ? h(Modules, {report, file, setFile, edits, setEdits, blank: src.trim() === ''}) : null,
          tab === 'shape'
            ? h('div', {},
                h('p', {className: 'lead'},
                  'Two shapes cannot be read off the data, so Tatami never guesses them. ',
                  h('strong', {}, 'Nothing here is set unless you set it.'),
                  ' Each choice below says what it does to the schema.'),
                h(Shape, {report, config, setConfig}))
            : null,
          tab === 'config' ? h(Config, {config, setConfig}) : null,
          tab === 'obs'
            ? h('div', {},
                h('p', {className: 'lead'},
                  "One block per table, with the counts each column's type came from. A count is per ",
                  h('strong', {}, 'visit'),
                  ' — once per document for the root table, once per parent for a nested one, ' +
                  'once per element for a collection.'),
                h(Obs, {report}))
            : null))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
