<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tatami</title>
<style>
  :root {
    --bg:#fbfaf7; --panel:#fff; --ink:#1c1a17; --dim:#6f6a61; --line:#e3dfd6;
    --accent:#7a4b2a; --code:#f5f2ec; --warm:#fff8ef; --edge:#efdfc9;
    --good:#2f6b3f; --bad:#a3271c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif}
  code,pre,textarea,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:20px 26px 16px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px;letter-spacing:.02em}
  .flow{font-size:12.5px;color:var(--accent);margin-top:5px}
  main{display:grid;grid-template-columns:340px 1fr;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  aside{border-right:1px solid var(--line);padding:18px 20px 60px}
  section{padding:18px 26px 80px;min-width:0}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
     margin:22px 0 8px;font-weight:600}
  aside h2:first-child,section h2:first-child{margin-top:0}
  pre{margin:0;padding:11px 13px;background:var(--code);border:1px solid var(--line);
      border-radius:6px;overflow-x:auto;font-size:12.5px;line-height:1.5}
  textarea{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);
           border-radius:6px;background:var(--panel);font-size:13px;resize:vertical;
           color:var(--ink)}
  textarea:focus{outline:2px solid var(--edge);border-color:var(--accent)}
  .bar{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  button.go{padding:7px 16px;border:0;border-radius:5px;background:var(--accent);
            color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.go:hover{background:#8e5931}
  .ex{padding:4px 9px;border:1px solid var(--line);border-radius:20px;
      background:var(--panel);font:inherit;font-size:12px;cursor:pointer;color:var(--dim)}
  .ex:hover{border-color:var(--accent);color:var(--accent)}
  table{border-collapse:collapse;font-size:13px;width:100%;background:var(--panel)}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);
        white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
     font-weight:600}
  td.mono{font-size:12.5px}
  .wrap{border:1px solid var(--line);border-radius:6px;overflow:auto}
  .hint{color:var(--dim);font-size:12.5px}
  .err{color:var(--bad);background:#fff4f2;border:1px solid #f0d5cf;border-radius:6px;
       padding:10px 12px;font-size:13px}
  .lic{list-style:none;margin:8px 0 0;padding:0}
  .lic li{padding:6px 11px;border-left:3px solid var(--accent);background:var(--warm);
          margin-bottom:5px;font-size:12.5px}
  .lic li.no{border-left-color:#b9a894;color:var(--dim)}
  .stage{margin-bottom:14px}
  .stage-head{display:flex;align-items:baseline;gap:10px}
  .kern{font-weight:600;color:var(--accent);font-size:13px}
  .detail{font-size:12.5px;color:var(--dim)}
  .pending{border:1px dashed var(--line);border-radius:6px;padding:14px;
           color:var(--dim);font-size:12.5px;background:var(--panel)}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.04em;padding:1px 6px;
       border-radius:3px;background:var(--code);color:var(--dim);margin-left:6px}
  .tag.null{background:#fdf0e6;color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>tatami</h1>
  <div class="flow">
    the <b>.mli</b> says what the data is &rarr; the <b>analysis</b> reads it
    &rarr; the <b>kernel</b> follows from that
  </div>
</header>

<main>
  <aside>
    <h2>schema/orders.mli</h2>
    <pre id="source" class="hint">loading…</pre>
    <h2>what we understood</h2>
    <div id="columns"></div>
    <p class="hint" style="margin-top:10px">
      This file is re-read on every run. Edit it, press Run, and the analysis
      changes its mind — no rebuild.
    </p>
  </aside>

  <section>
    <h2>query</h2>
    <textarea id="sql" spellcheck="false">select qty from orders where qty &gt; 4</textarea>
    <div class="bar">
      <button class="go" id="run">Run</button>
      <span id="examples"></span>
    </div>
    <div id="out"></div>
  </section>
</main>

<script>
const EXAMPLES = [
  "select qty from orders where qty > 4",
  "select * from orders",
  "select id, qty, price from orders",
  "select note from orders where note = 'rush'",
  "select sku from orders where sku = 'TATAMI-01'",
  "select price from orders where price <= 49.5",
];

const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a))
    k === "class" ? (n.className = v) : n.setAttribute(k, v);
  for (const k of [].concat(kids)) if (k !== null && k !== undefined) n.append(k);
  return n;
};

function columnsTable(cols) {
  const t = el("table");
  t.append(el("thead", {}, [el("tr", {}, ["column", "layout"].map(h => el("th", {}, [h])))]));
  const tb = el("tbody");
  for (const c of cols)
    tb.append(el("tr", {}, [
      el("td", { class: "mono" }, [c.name]),
      el("td", { class: "mono" }, [
        c.layout,
        c.nullable ? el("span", { class: "tag null" }, ["nullable"]) : null,
      ]),
    ]));
  t.append(tb);
  return el("div", { class: "wrap" }, [t]);
}

// One block per kernel in the pipeline. A filter is only one of them: with no
// predicate the projection is the identity, which is a larger win than
// anything a predicate offers and is invisible unless each stage is shown.
function stagesPanel(stages) {
  return el("div", {}, stages.map(st =>
    el("div", { class: "stage" }, [
      el("div", { class: "stage-head" }, [
        el("span", { class: "kern" }, [st.kernel]),
        el("span", { class: "detail mono" }, [st.detail]),
      ]),
      el("ul", { class: "lic" }, st.licences.map(l =>
        el("li", { class: l.good ? "" : "no" }, [l.text]))),
    ])));
}

async function run(sql) {
  const out = document.getElementById("out");
  out.replaceChildren(el("p", { class: "hint" }, ["running…"]));
  const r = await fetch("/api/query", { method: "POST", body: sql }).then(x => x.json());
  if (r.error) {
    out.replaceChildren(el("h2", {}, ["error"]), el("div", { class: "err" }, [r.error]));
    return;
  }
  out.replaceChildren(
    el("h2", {}, ["what we understood"]),
    el("pre", {}, [r.understood]),
    el("h2", {}, ["what the signature licenses, kernel by kernel"]),
    stagesPanel(r.stages),
    el("h2", {}, ["kernels"]),
    el("div", { class: "pending" }, [
      "Waiting on plain.ml and tuned.ml. This becomes two timings over the ",
      "same columns — the generic loop, and the loop the analysis above chose.",
    ]));
  loadSchema();
}

async function loadSchema() {
  const s = await fetch("/api/schema").then(x => x.json());
  if (s.error) {
    document.getElementById("source").textContent = s.error;
    return;
  }
  document.getElementById("source").textContent = s.source.trim();
  document.getElementById("source").className = "mono";
  document.getElementById("columns").replaceChildren(columnsTable(s.columns));
}

(async () => {
  const box = document.getElementById("examples");
  box.replaceChildren(...EXAMPLES.map(q => {
    const b = el("button", { class: "ex" }, [q.length > 30 ? q.slice(0, 28) + "…" : q]);
    b.title = q;
    b.style.margin = "0 4px 5px 0";
    b.onclick = () => { document.getElementById("sql").value = q; run(q); };
    return b;
  }));
  document.getElementById("run").onclick = () =>
    run(document.getElementById("sql").value);
  document.getElementById("sql").addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter")
      run(document.getElementById("sql").value);
  });
  await loadSchema();
  run(document.getElementById("sql").value);
})();
</script>
</body>
</html>
