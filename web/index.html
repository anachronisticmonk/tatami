<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tatami</title>
<style>
  /* Dark by default, the palette a code editor uses -- VS Code's Dark+ -- so
     that this page, the reassemble page and the playground agree. Light is the
     other one, and there is no third. */
  :root{--bg:#1E1E1E;--panel:#252526;--ink:#D4D4D4;--dim:#9D9D9D;--line:#3C3C3C;
        --accent:#4FC1FF;--code:#1B1B1B;--warm:#10344F;--edge:#2E5A78;
        --good:#6A9955;--bad:#F48771;--rec:#C586C0;--col:#4FC1FF;--json:#858585}
  :root[data-theme="dark"]{--bg:#1E1E1E;--panel:#252526;--ink:#D4D4D4;--dim:#9D9D9D;--line:#3C3C3C;
        --accent:#4FC1FF;--code:#1B1B1B;--warm:#10344F;--edge:#2E5A78;
        --good:#6A9955;--bad:#F48771;--rec:#C586C0;--col:#4FC1FF;--json:#858585}
  /* Light. The accent is a deep saffron rather than #FF9933: flag saffron on a
     pale ground is about 2:1 against the text beside it, which fails at body
     size, while this reads as the same hue at 4.7:1. */
  :root[data-theme="light"]{--bg:#FFF6EA;--panel:#FFFDFA;--ink:#241A10;--dim:#6B5742;--line:#EBD9C2;
        --accent:#B35C00;--code:#FDF1E3;--warm:#FFE4C4;--edge:#E8C79A;
        --good:#2F6B3F;--bad:#9E3A22;--rec:#7A4B82;--col:#B35C00;--json:#A08A63}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif}
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:18px 26px 0;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:17px;letter-spacing:.02em}
  .sub{font-size:12.5px;color:var(--dim);margin-top:4px}
  nav{display:flex;gap:2px;margin-top:14px}
  nav button{padding:9px 18px;border:1px solid var(--line);border-bottom:none;
             border-radius:6px 6px 0 0;background:transparent;color:var(--dim);
             font:inherit;font-size:13px;cursor:pointer;position:relative;top:1px}
  nav button.on{background:var(--bg);color:var(--accent);font-weight:600;
                border-color:var(--line);border-bottom:1px solid var(--bg)}
  main{padding:22px 26px 90px;max-width:1180px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
     margin:26px 0 8px;font-weight:600}
  h2:first-child{margin-top:0}
  p.lead{font-size:13px;color:var(--dim);margin:0 0 12px;max-width:74ch}
  pre{margin:0;padding:11px 13px;background:var(--code);border:1px solid var(--line);
      border-radius:6px;overflow:auto;font-size:12.5px;line-height:1.5;max-height:520px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:15px 17px;margin-bottom:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  @media(max-width:980px){.two{grid-template-columns:1fr}}
  table{border-collapse:collapse;font-size:12.5px;width:100%;background:var(--panel)}
  th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600}
  td.num{text-align:right;font-family:ui-monospace,Menlo,monospace}
  .wrap{border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:340px}
  .null{color:var(--bad);font-style:italic}
  .tag{display:inline-block;font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:3px;
       background:var(--warm);border:1px solid var(--edge);color:var(--accent)}
  .tag.off{background:#f2f0ec;border-color:var(--line);color:var(--dim)}
  button.go{padding:7px 15px;border:0;border-radius:5px;background:var(--accent);
            color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.go:hover{background:#8e5931}
  .q{padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
     font:inherit;font-size:12px;cursor:pointer;color:var(--dim)}
  .q.on{border-color:var(--accent);color:var(--accent);background:var(--warm);font-weight:600}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  input[type=text]{padding:6px 10px;border:1px solid var(--line);border-radius:5px;
                   font:inherit;font-size:13px;width:290px;background:var(--panel);color:var(--ink)}
  .win{color:var(--good);font-weight:600}
  .loss{color:var(--bad);font-weight:600}
  .hint{color:var(--dim);font-size:12.5px}
  .note{background:var(--warm);border:1px solid var(--edge);border-radius:6px;
        padding:10px 12px;font-size:12.5px;margin-top:10px}
  .key{display:flex;gap:16px;font-size:12px;color:var(--dim);margin:4px 0 10px}
  .key i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .themebtn{position:absolute;top:18px;right:26px;padding:5px 11px;border:1px solid var(--line);
            border-radius:5px;background:var(--panel);color:var(--dim);font:inherit;font-size:12px;
            cursor:pointer}
  .themebtn:hover{border-color:var(--accent);color:var(--accent)}
  header{position:relative}
  .arrow{color:var(--accent);font-size:20px;text-align:center;padding:6px 0}
</style>
</head>
<body>
<header>
  <button class="themebtn" id="themebtn">dark</button>
  <h1>tatami</h1>
  <div class="sub" id="sub">schemaless JSON &rarr; a typed columnar schema, and what that buys</div>
  <nav>
    <button data-tab="data" class="on">Data</button>
    <button data-tab="query">Query</button>
    <button data-tab="perf">Performance</button>
  </nav>
</header>
<main>
  <section id="data"></section>
  <section id="query" hidden></section>
  <section id="perf" hidden></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/* Dark unless the reader says otherwise, and remembered. localStorage throws
   in a private window, so every touch of it is guarded. Each port is its own
   origin, so the choice is per-port. */
(function () {
  var read = function () {
    try { var v = localStorage.getItem('tatami-theme');
          return v === 'light' || v === 'dark' ? v : 'dark'; } catch (e) { return 'dark'; }
  };
  var apply = function (t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('tatami-theme', t); } catch (e) {}
    var b = document.getElementById('themebtn');
    if (b) b.textContent = t;
  };
  var cur = read();
  apply(cur);
  document.addEventListener('DOMContentLoaded', function () {
    apply(cur);
    var b = document.getElementById('themebtn');
    if (b) b.onclick = function () { cur = cur === 'dark' ? 'light' : 'dark'; apply(cur); };
  });
})();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cell = v => v === null || v === undefined
  ? '<span class="null">NULL</span>' : esc(v);

/* The bench reports the cost of one call. For `document` that is a hash lookup
   and a walk of one repo's subtree -- a fraction of a microsecond -- and
   milliseconds to two decimals would round every such figure to 0.00. So the
   unit follows the magnitude. */
const dur = v =>
  !(v > 0)      ? 'too fast'
  : v >= 1      ? v.toFixed(2) + 'ms'
  : v >= 0.001  ? (v * 1000).toFixed(2) + '\u00b5s'
  :               (v * 1e6).toFixed(0) + 'ns';

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['data','query','perf'].forEach(t => $('#' + t).hidden = (t !== b.dataset.tab));
  if (b.dataset.tab === 'perf') drawPerf();
});

function tbl(rows) {
  if (!rows || !rows.length) return '<p class="hint">none</p>';
  const cols = Object.keys(rows[0]);
  return `<div class="wrap"><table><thead><tr>${cols.map(c =>
    `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r =>
    `<tr>${cols.map(c => `<td class="${typeof r[c] === 'number' ? 'num' : ''}">${
      cell(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------------- tab 1: data ---------------- */
Promise.all([fetch('/api/sample').then(r => r.json()),
             fetch('/api/schema').then(r => r.json()),
             fetch('/api/stats').then(r => r.json())]).then(([s, schema, st]) => {
  $('#sub').textContent =
    `${st.corpus} — ${st.repos.toLocaleString()} repos, ${(st.bytes/1e6).toFixed(1)} MB, ` +
    `held in both stores (records ${st.records_load_ms.toFixed(0)}ms, columnar ${st.columnar_load_ms.toFixed(0)}ms)`;

  $('#data').innerHTML = `
    <h2>one document</h2>
    <p class="lead">A repo carries its whole build history inside it — that is what makes it
    a document and not a table. Optional fields appear two ways: explicitly
    <code>null</code>, or simply absent.</p>
    <div class="two">
      <div class="card"><pre>${esc(JSON.stringify(s.document, null, 2))}</pre></div>
      <div>
        <div class="card">
          <div class="hint" style="margin-bottom:6px"><b>repo</b> — the root</div>
          ${tbl(s.repo)}
        </div>
        <div class="arrow">↓ <span class="hint" style="font-size:11px">runs[] &nbsp;point back with repo_id + idx</span></div>
        <div class="card"><div class="hint" style="margin-bottom:6px"><b>run</b></div>${tbl(s.run)}</div>
        <div class="arrow">↓ <span class="hint" style="font-size:11px">jobs[]</span></div>
        <div class="card"><div class="hint" style="margin-bottom:6px"><b>job</b></div>${tbl(s.job)}</div>
        <div class="arrow">↓ <span class="hint" style="font-size:11px">steps[]</span></div>
        <div class="card"><div class="hint" style="margin-bottom:6px"><b>step</b></div>${tbl(s.step)}</div>
      </div>
    </div>
    <h2>the schema Phase 1 emits</h2>
    <p class="lead">One <code>.mli</code> per table. A key is stored the way the thing it points
    at is stored — <code>repo.id</code> is a uuid, so <code>run.repo_id</code> is text;
    <code>job.id</code> is an int, so <code>step.job_id</code> is dense.</p>
    <div class="two">${schema.map(t => `
      <div class="card">
        <div class="hint" style="margin-bottom:6px"><b>${esc(t.table)}.mli</b></div>
        <pre style="max-height:200px">${esc(t.source)}</pre>
        <div class="wrap" style="margin-top:9px"><table><thead><tr><th>column</th><th>stored as</th>
        <th>mask</th><th>points at</th></tr></thead><tbody>${t.columns.map(c => `
          <tr><td class="mono">${esc(c.name)}</td><td class="mono">${esc(c.layout)}</td>
          <td><span class="tag ${c.nullable ? '' : 'off'}">${c.nullable ? 'allocated' : 'none'}</span></td>
          <td class="mono">${c.refers_to ? esc(c.refers_to) : '—'}</td></tr>`).join('')}
        </tbody></table></div>
      </div>`).join('')}</div>`;

  /* ---------------- tab 2: query ---------------- */
  const QUERIES = [
    {k:'scan',      p:'30000', label:'steps over 30s',        sql:'select count(*) from step where ms > 30000'},
    {k:'computed',  p:'30000', label:'what slow steps cost',  sql:'select sum(ms * rate) from step where ms > 30000'},
    {k:'by_status', p:'',      label:'slowest per command',   sql:'select name, max(ms) from step group by name'},
    {k:'document',  p:'',      label:'everything about one repo', sql:"select count(distinct u.id) runs, count(distinct j.id) jobs, count(s.id) steps, coalesce(sum(s.ms),0) ms from repo r left join run u on u.repo_id=r.id left join job j on j.run_id=u.id left join step s on s.job_id=j.id where r.id='<repo id>'"},
    {k:'three_hop', p:'stark', label:'build time for an org', sql:"select sum(s.ms) from repo r join run u on u.repo_id=r.id join job j on j.run_id=u.id join step s on s.job_id=j.id where r.org='stark'"},
  ];
  let cur = 0;
  $('#query').innerHTML = `
    <h2>ask the corpus</h2>
    <p class="lead">Both stores are already loaded and answer the same question side by side.
    This is the load-once/query-many case: the shredding is already paid for, so what is
    being timed is the query and nothing else.</p>
    <div class="card">
      <div class="bar" id="qpick"></div>
      <div class="bar">
        <span class="hint">parameter</span>
        <input type="text" id="qparam">
        <button class="go" id="qrun">Run</button>
      </div>
      <pre id="qsql" style="margin-top:4px"></pre>
      <div id="qout"></div>
    </div>`;
  const paint = () => {
    $('#qpick').innerHTML = QUERIES.map((q, i) =>
      `<button class="q ${i === cur ? 'on' : ''}" data-i="${i}">${esc(q.label)}</button>`).join('');
    $('#qpick').querySelectorAll('button').forEach(b => b.onclick = () => {
      cur = +b.dataset.i; $('#qparam').value = QUERIES[cur].p; paint(); go(); });
    $('#qsql').textContent = QUERIES[cur].sql;
  };
  const go = async () => {
    $('#qout').innerHTML = '<p class="hint" style="margin-top:10px">running…</p>';
    const r = await fetch('/api/query', {method:'POST',
      body: QUERIES[cur].k + ' ' + $('#qparam').value});
    const d = await r.json();
    if (d.error) { $('#qout').innerHTML = `<div class="note">${esc(d.error)}</div>`; return; }
    const max = Math.max(d.records.ms, d.columnar.ms) || 1;
    const row = (name, o, colour) => `
      <div style="margin:8px 0 2px"><b>${name}</b>
        <span class="hint">${dur(o.ms)} &middot; median of 5</span></div>
      <div style="height:14px;background:var(--code);border:1px solid var(--line);border-radius:3px">
        <div style="width:${o.ms / max * 100}%;height:100%;background:${colour};border-radius:2px"></div></div>`;
    $('#qout').innerHTML = `
      ${row('records (row-major)', d.records, 'var(--rec)')}
      ${row('columnar', d.columnar, 'var(--col)')}
      <div class="note">answer <code>${esc(d.columnar.answer)}</code> —
        the two stores ${d.agree ? 'agree' : '<b class="loss">DISAGREE</b>'}.
        ${d.ratio >= 1
          ? `columnar is <b class="win">${d.ratio.toFixed(1)}× faster</b>`
          : `row-major is <b class="loss">${(1/d.ratio).toFixed(1)}× faster</b> — it already holds the nesting`}.
      </div>`;
  };
  $('#qrun').onclick = go;
  $('#qparam').value = QUERIES[0].p;
  paint(); go();
});

/* ---------------- tab 3: performance (React) ---------------- */
const h = React.createElement;
let perfRoot = null;

function Bars({rows, keys, colours, fmt, label}) {
  const max = Math.max(...rows.flatMap(r => keys.map(k => r[k] || 0))) || 1;
  return h('div', {}, rows.map(r =>
    h('div', {key: r.label, style: {marginBottom: 12}},
      h('div', {style: {fontSize: 12, marginBottom: 3}}, r.label),
      keys.map((k, i) =>
        h('div', {key: k, style: {display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2}},
          h('div', {style: {flex: 1, height: 13, background: 'var(--code)',
                            border: '1px solid var(--line)', borderRadius: 3}},
            h('div', {style: {width: ((r[k] || 0) / max * 100) + '%', height: '100%',
                              background: colours[i], borderRadius: 2}})),
          h('div', {style: {width: 96, fontSize: 11, color: 'var(--dim)',
                            fontFamily: 'ui-monospace,Menlo,monospace'}},
            fmt(r[k]) + ' ' + k))))));
}

function Line({runs, query}) {
  const W = 720, H = 240, pl = 56, pb = 30, pt = 10, pr = 56;
  const pts = runs.map(run => ({
    x: run.bytes / 1e6,
    rec: (run.stores.find(s => s.name === 'records').queries.find(q => q.q === query) || {}).ms,
    col: (run.stores.find(s => s.name === 'columnar').queries.find(q => q.q === query) || {}).ms,
  })).sort((a, b) => a.x - b.x);
  const xmax = Math.max(...pts.map(p => p.x)) || 1;
  const ymax = Math.max(...pts.flatMap(p => [p.rec, p.col])) || 1;
  const X = v => pl + v / xmax * (W - pl - pr);
  const Y = v => H - pb - v / ymax * (H - pb - pt);
  const path = k => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x)},${Y(p[k])}`).join(' ');
  return h('svg', {viewBox: `0 0 ${W} ${H}`, style: {maxWidth: '100%'}},
    [0, .25, .5, .75, 1].map(f =>
      h('g', {key: f},
        h('line', {x1: pl, y1: Y(ymax * f), x2: W - pr, y2: Y(ymax * f), stroke: '#e3dfd6'}),
        h('text', {x: pl - 8, y: Y(ymax * f) + 4, textAnchor: 'end', fontSize: 10.5,
                   fill: '#6f6a61'}, (ymax * f).toFixed(0)))),
    [['rec', 'var(--rec)', 'records'], ['col', 'var(--col)', 'columnar']].map(([k, c, n]) =>
      h('g', {key: k},
        h('path', {d: path(k), fill: 'none', stroke: c, strokeWidth: 2}),
        pts.map((p, i) => h('circle', {key: i, cx: X(p.x), cy: Y(p[k]), r: 2.5, fill: c})),
        h('text', {x: X(pts[pts.length-1].x) + 6, y: Y(pts[pts.length-1][k]) + 4,
                   fontSize: 11, fill: c}, n))),
    pts.map((p, i) => h('text', {key: 'x' + i, x: X(p.x), y: H - 10, textAnchor: 'middle',
                                 fontSize: 10.5, fill: '#6f6a61'}, p.x.toFixed(0))),
    h('text', {x: W / 2, y: H - 0, textAnchor: 'middle', fontSize: 11, fill: '#6f6a61'},
      'corpus MB'));
}

/* Selectivity: does the winner ever change as the predicate keeps more rows?
   A placement rule read off the types cannot see selectivity, so this is the
   chart that would falsify it. */
function Sweep({points}) {
  const W = 720, H = 250, pl = 44, pb = 42, pt = 12, pr = 20;
  const xs = points.map((p, i) => i);
  const ratio = p => p.scan_rec / p.scan_col;
  const ymax = Math.max(...points.map(ratio), 4);
  const X = i => pl + (i / Math.max(1, points.length - 1)) * (W - pl - pr);
  const Y = v => H - pb - (v / ymax) * (H - pb - pt);
  return h('svg', {viewBox: `0 0 ${W} ${H}`, style: {maxWidth: '100%'}},
    h('line', {x1: pl, y1: Y(1), x2: W - pr, y2: Y(1), stroke: '#a3271c',
               strokeDasharray: '4 3'}),
    h('text', {x: W - pr, y: Y(1) - 5, textAnchor: 'end', fontSize: 10.5, fill: '#a3271c'},
      '1× — below this line row-major would win'),
    [0.25, 0.5, 0.75, 1].map(f =>
      h('text', {key: f, x: pl - 8, y: Y(ymax * f) + 4, textAnchor: 'end', fontSize: 10.5,
                 fill: '#6f6a61'}, (ymax * f).toFixed(0) + '×')),
    h('path', {d: xs.map(i => `${i ? 'L' : 'M'}${X(i)},${Y(ratio(points[i]))}`).join(' '),
               fill: 'none', stroke: 'var(--col)', strokeWidth: 2}),
    xs.map(i => h('circle', {key: i, cx: X(i), cy: Y(ratio(points[i])), r: 3, fill: 'var(--col)'})),
    xs.map(i => h('text', {key: 't' + i, x: X(i), y: H - 22, textAnchor: 'middle',
                           fontSize: 10, fill: '#6f6a61'},
                  points[i].pct.toFixed(points[i].pct < 1 ? 2 : 0) + '%')),
    h('text', {x: W / 2, y: H - 4, textAnchor: 'middle', fontSize: 11, fill: '#6f6a61'},
      'rows kept by the predicate'));
}

const WHAT = {
  document:  ['everything about one repo', 'its runs, jobs and steps — a reassembly'],
  scan:      ['steps over 30s', 'count over one column of seven'],
  computed:  ['what the slow steps cost', 'sum(ms × rate) — two columns and arithmetic'],
  by_status: ['slowest per command', 'group by a string column'],
  three_hop: ['build time for one org', 'repo → run → job → step, three joins'],
};

/* Anything inside this band is noise, not a result. Whole-benchmark variance
   measured between repeated runs is about 10-15%. */
const NOISE = 1.3;

/* Below this both answers are quicker than the clock can resolve, and a ratio
   of two unmeasurable numbers is not a measurement. */
/* Was 0.01ms, the point below which a single timed call said more about the
   clock than the store. bin/bench.ml repeats a call until it can be resolved
   and divides back down, so figures below that are real and only an outright
   zero means nothing was measured. */
const FLOOR = 0;

function verdict(rec, col) {
  if (!(rec > FLOOR) && !(col > FLOOR))
    return ['too fast to measure', 'hint', ''];
  const r = rec / col;
  if (!isFinite(r)) return ['too fast to measure', 'hint', ''];
  if (r >= NOISE) return ['columnar', 'win', r.toFixed(2) + '×'];
  if (r <= 1 / NOISE) return ['row-major', 'loss', (1 / r).toFixed(2) + '×'];
  return ['neither — inside noise', 'hint', ''];
}

function Perf({data}) {
  const [query, setQuery] = React.useState('computed');
  /* the file holds two kinds of record: benchmark runs, and selectivity
     sweeps. Reading a sweep as a run is what left this tab blank. */
  const runs = data.filter(d => !d.sweep && d.stores);
  const sweeps = data.filter(d => d.sweep && d.points);
  if (!runs.length) return h('div', {className: 'note'},
    'No measurements yet. Run: dune exec bin/bench.exe -- --corpus corpus/small.json --json bench/results.jsonl');

  const last = runs[runs.length - 1];
  const store = (run, n) => run.stores.find(s => s.name === n);
  const at = (run, n, q) => (store(run, n).queries.find(x => x.q === q) || {}).ms;
  const qs = store(last, 'records').queries.map(q => q.q);

  /* What it costs to build, against what it saves per query: how many
     questions before the shredding has paid for itself. */
  const extra = store(last, 'columnar').load_ms - store(last, 'records').load_ms;
  const cross = qs.map(q => {
    const rec = at(last, 'records', q), col = at(last, 'columnar', q);
    const saved = rec - col;
    /* a saving smaller than the clock can see is not a saving */
    return {q, saved, n: saved > FLOOR ? extra / saved : null};
  }).filter(x => x.n !== null && x.n > 0).sort((a, b) => a.n - b.n);

  return h('div', {},
    h('div', {className: 'note'},
      'These are frozen measurements from ', h('code', {}, 'bin/bench.exe'),
      ', median of ', String(last.repeats), ' with a warm-up discarded — not a live run. ',
      'The Query tab times the corpus this server is holding; these do not have to match.'),

    h('h2', {}, 'who wins what — ' + last.corpus + ', ' + (last.bytes / 1e6).toFixed(0) + ' MB'),
    h('div', {className: 'wrap'},
      h('table', {},
        h('thead', {}, h('tr', {},
          ['query', 'what it asks', 'records', 'columnar', 'winner'].map(x =>
            h('th', {key: x}, x)))),
        h('tbody', {}, qs.map(q => {
          const rec = at(last, 'records', q), col = at(last, 'columnar', q);
          const [who, cls, by] = verdict(rec, col);
          return h('tr', {key: q},
            h('td', {className: 'mono'}, q),
            h('td', {style: {whiteSpace: 'normal', color: 'var(--dim)', fontSize: 12}},
              (WHAT[q] || ['', ''])[1]),
            h('td', {className: 'num'}, dur(rec)),
            h('td', {className: 'num'}, dur(col)),
            h('td', {}, h('span', {className: cls === 'hint' ? 'hint' : cls},
              who + (cls === 'hint' ? '' : ' by ' + by))));
        })))),
    h('p', {className: 'lead', style: {marginTop: 8}},
      'Anything within ', String(NOISE), '× is reported as neither: repeated whole runs ',
      'vary by ten to fifteen percent, so a smaller difference is the machine, not the layout.'),

    h('h2', {}, 'when does shredding pay for itself'),
    h('p', {className: 'lead'},
      'Columnar costs ', h('b', {}, (extra / 1000).toFixed(1) + 's'),
      ' more to build than records at this size. Against what it then saves per query, ',
      'that is how many questions must be asked of one loaded corpus before it is ahead. ',
      'Ask fewer and the row-major store was the right choice.'),
    h('div', {className: 'card'},
      cross.length
        ? h(Bars, {rows: cross.map(x => ({label: x.q, queries: x.n})), keys: ['queries'],
                   colours: ['var(--col)'], fmt: v => Math.ceil(v) + ''})
        : h('div', {className: 'hint'}, 'nothing saves time at this size')),

    h('h2', {}, 'time per query'),
    h('div', {className: 'key'},
      h('span', {}, h('i', {style: {background: 'var(--rec)'}}), 'records'),
      h('span', {}, h('i', {style: {background: 'var(--col)'}}), 'columnar')),
    h('div', {className: 'card'},
      h(Bars, {rows: qs.map(q => ({label: q, records: at(last, 'records', q),
                                   columnar: at(last, 'columnar', q)})),
               keys: ['records', 'columnar'], colours: ['var(--rec)', 'var(--col)'],
               fmt: v => (v === undefined ? '–' : v.toFixed(2) + 'ms')}),
      h('div', {className: 'hint', style: {marginTop: 6}},
        'Re-parsing the JSON per query, which is the third thing measured, takes ',
        (at(last, 'json', 'scan') / 1000).toFixed(1), 's for the same scan — ',
        Math.round(at(last, 'json', 'scan') / at(last, 'columnar', 'scan')).toLocaleString(),
        '× the columnar time. It is left off the chart because it would flatten everything else.')),

    h('h2', {}, 'how it scales'),
    h('div', {className: 'bar'},
      qs.map(q => h('button', {key: q, className: 'q' + (q === query ? ' on' : ''),
                               onClick: () => setQuery(q)}, q))),
    h('div', {className: 'card'}, h(Line, {runs, query}),
      h('div', {className: 'hint', style: {marginTop: 6}},
        (WHAT[query] || ['', ''])[1])),

    h('h2', {}, 'what each store costs to build'),
    h('div', {className: 'card'},
      h(Bars, {rows: runs.map(r => ({label: (r.bytes / 1e6).toFixed(0) + ' MB',
                 records: store(r, 'records').load_ms,
                 columnar: store(r, 'columnar').load_ms})),
               keys: ['records', 'columnar'], colours: ['var(--rec)', 'var(--col)'],
               fmt: v => (v / 1000).toFixed(1) + 's'})),

    sweeps.length ? h('div', {},
      h('h2', {}, 'does selectivity change the winner?'),
      h('p', {className: 'lead'},
        'A placement rule read off the types cannot see selectivity — whether a predicate keeps one row in a thousand or half the table is a fact about the data, not the schema. If the winner flipped along this axis, no type-level rule could be right. It does not flip: the line stays above 1× throughout.'),
      h('div', {className: 'card'}, h(Sweep, {points: sweeps[sweeps.length - 1].points}))) : null);
}

function drawPerf() {
  fetch('/api/bench').then(r => r.json()).then(data => {
    if (!perfRoot) perfRoot = ReactDOM.createRoot($('#perf'));
    perfRoot.render(h(Perf, {data}));
  }).catch(e => {
    $('#perf').innerHTML = `<div class="note">could not load measurements: ${esc(e)}</div>`;
  });
}
</script>
</body>
</html>
